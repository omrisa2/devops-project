apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-project
  template:
    metadata:
      labels:
        app: devops-project
    spec:
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: api
          image: docker.io/omrisaban/devops-project
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database-url
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devops-project
spec:
  type: LoadBalancer
  selector:
    app: devops-project
  ports:
    - port: 80
      targetPort: 8000
