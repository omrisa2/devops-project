# Runs the same checks as the CI, on this machine, before each commit.
# The tools come from the venv (requirements-dev.txt), so activate it first.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: unsupported
        types: [python]

      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check
        language: unsupported
        types: [python]

      - id: mypy
        name: mypy
        entry: mypy
        language: unsupported
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest with coverage
        entry: pytest --cov
        language: unsupported
        types: [python]
        pass_filenames: false
