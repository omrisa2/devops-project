name: Merge

on:
  push:
    branches: [main]

jobs:
  image-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub with the stored token
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, tag with the commit SHA, and push
        id: push
        run: |
          IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/devops-project:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image-push
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy - Task 6 deploys ${{ needs.image-push.outputs.image }} here"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: echo "smoke-test - Task 6 calls the deployed app here"
