name: Pull request

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python, with a cache for pip downloads
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install the app and the check tools
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check the formatting with ruff
        run: ruff format --check .

      - name: Check the types with mypy
        run: mypy

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}, with a cache for pip downloads
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install the app and the test tools
        run: pip install -r requirements-dev.txt

      - name: Run the unit tests with coverage
        run: pytest --cov

  image-build:
    needs: [lint, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the image, no login and no push
        run: docker build -t devops-project:pr .

  integration-tests:
    needs: image-build
    runs-on: ubuntu-latest
    steps:
      - run: echo "integration-tests - Task 8 runs the image against a database here"

  security:
    needs: image-build
    runs-on: ubuntu-latest
    steps:
      - run: echo "security - Task 9 scans the code and the image here"
